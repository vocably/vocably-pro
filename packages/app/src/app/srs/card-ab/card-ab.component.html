<div class="content">
  <app-srs-reverse-front
    class="srs-card-font"
    [card]="card"
    [isChecked]="correct || answerDisplayed"
  ></app-srs-reverse-front>
</div>
<div class="footer">
  <div
    class="tiles"
    [style.--count]="letters.length"
    [style.--gap]="tileGap + 'px'"
  >
    <div class="row" [class.rtl]="isRtl" [@shake]="wrong">
      @for (letterIndex of answer; track $index) {
        <button
          class="tile slot"
          [class.next]="letterIndex === false && $index === nextSlotIndex"
          [class.filled]="letterIndex !== false"
          [class.wrong]="wrong"
          [class.correct]="correct"
          [disabled]="correct || letterIndex === false"
          (click)="unuseLetter($index)"
        >
          @if (letterIndex !== false) {
            {{ accessibleLetter(letters[letterIndex]) }}
          }
        </button>
      }
    </div>
    <div class="row" [class.rtl]="isRtl">
      @for (letter of letters; track $index) {
        @let isUsed = answer.includes($index);
        <button
          class="tile option"
          [class.used]="isUsed"
          [disabled]="correct || isUsed"
          (click)="useLetter($index)"
        >
          @if (!isUsed) {
            {{ accessibleLetter(letter) }}
          }
        </button>
      }
    </div>
  </div>
  <div class="actions">
    <button
      class="action outlined"
      [disabled]="correct || isAnswerEmpty"
      (click)="clearAll()"
    >
      <mat-icon aria-hidden="true">backspace</mat-icon>
      {{ 'srs.card.clear_all' | transloco }}
    </button>
    @if (!answerDisplayed) {
      <button
        class="action tonal"
        [disabled]="correct"
        (click)="answerDisplayed = true"
      >
        <mat-icon aria-hidden="true">visibility</mat-icon>
        {{ 'srs.card.show_answer' | transloco }}
      </button>
    } @else {
      <div class="revealed">
        <app-play-sound
          [language]="card.data.language"
          [text]="card.data.source"
        ></app-play-sound>
        <span class="revealed-text">{{ correctAnswer }}</span>
      </div>
    }
  </div>
</div>
